[project]
name = "prompt-weaver-launcher"
version = "0.1.0"
description = "Development launcher for Prompt Weaver Local"
requires-python = ">=3.11"
dependencies = [
  "devlauncher",
]

[tool.uv]
package = true

[tool.uv.sources]
devlauncher = { path = "D:/Anything/libs/devlauncher_reusable_pattern", editable = true }

[project.scripts]
prompt-weaver-launcher = "prompt_weaver_launcher.cli:main"
