[project]
name = "prompt-weaver-local-backend"
version = "0.2.0"
description = "Local backend for Prompt Weaver Local"
requires-python = ">=3.11"
dependencies = [
  "diffusion-lora-runtime",
  "fastapi>=0.115.0",
  "pillow>=11.0.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.32.0",
  "websockets>=13.1",
  "torch>=2.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
diffusion-lora-runtime = { git = "file:///D:/Anything/libs/diffusion-lora-runtime", tag = "0.1.4" }
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
